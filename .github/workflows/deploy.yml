name: Deploy to Google Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Cloud Function (Storage Trigger)
        run: |
          gcloud functions deploy process_file \
            --gen2 \
            --runtime python311 \
            --source . \
            --trigger-bucket ${{ vars.GCP_BUCKET_NAME }} \
            --trigger-location us-central1 \
            --trigger-service-account 569625288688-compute@developer.gserviceaccount.com \
            --entry-point process_file \
            --region us-central1 \
            --no-allow-unauthenticated \
            --quiet

      - name: Deploy Cloud Function (HTTP Trigger)
        run: |
          gcloud functions deploy http_hello_world \
            --gen2 \
            --runtime python311 \
            --source . \
            --trigger-http \
            --entry-point http_hello_world \
            --region us-central1 \
            --allow-unauthenticated \
            --quiet
